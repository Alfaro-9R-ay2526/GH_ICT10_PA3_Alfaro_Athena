<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Working with dictionaries</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        form {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(238, 156, 167, 0.4);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 2px solid #ffccd5;
        }

        h2 {
            color: #d63384;
            font-size: 1.4rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            outline: none;
            font-size: 1rem;
            color: #555;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: #f1a7b9;
        }

        input[type="text"]:focus {
            border-color: #d63384;
            box-shadow: 0 0 8px rgba(214, 51, 132, 0.3);
        }

        input[type="button"] {
            background-color: #ff6b8b;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            width: 100%;
        }

        input[type="button"]:hover {
            background-color: #d63384;
            transform: translateY(-2px);
        }

        input[type="button"]:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 12px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            color: #d63384;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #ffccd5;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <form>
        <h2>Know the creator of your favorite game</h2>
        <input type="text" id="dictionary" placeholder="Enter your favorite game"><br>
        <input type="button" py-click="game_details" value="Search">
    </form>

    <div id="result">Results will appear here...</div>

    <py-script src="main.py"></py-script>

</body>

</html>
